name: Local contract and security regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime versions and local checks
        shell: bash
        run: |
          php -v
          node -v
          php -r 'if (PHP_VERSION_ID < 80200) exit(1);'
          sh tests/run.sh
      - name: Canonical Source of Truth contract validation
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, tempfile, pathlib, subprocess, sys
          source=pathlib.Path('SOURCE_OF_TRUTH_REFERENCE/OverseasJob_v1.3.3_Source_of_Truth_Project_Pack.zip')
          with tempfile.TemporaryDirectory() as temp:
              with zipfile.ZipFile(source) as z:
                  assert z.testzip() is None, 'Canonical pack corrupted'
                  z.extractall(temp)
              validators=list(pathlib.Path(temp).rglob('23_VALIDATE_SPEC.py'))
              assert len(validators)==1, 'Missing canonical validator'
              subprocess.run([sys.executable,str(validators[0])],cwd=validators[0].parent,check=True)
          PY
