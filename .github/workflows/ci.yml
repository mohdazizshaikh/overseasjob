name: Local contract and security regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime versions and local checks
        shell: bash
        run: |
          php -v
          node -v
          php -r 'if (PHP_VERSION_ID < 80200) exit(1);'
          sh tests/run.sh
      - name: Verify isolated split Hostinger preview archives
        run: python3 tests/hostinger_bundle_tests.py
      - name: Canonical Source of Truth contract validation
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, tempfile, pathlib, subprocess, sys
          source=pathlib.Path('SOURCE_OF_TRUTH_REFERENCE/OverseasJob_v1.3.3_Source_of_Truth_Project_Pack.zip')
          with tempfile.TemporaryDirectory() as temp:
              with zipfile.ZipFile(source) as z:
                  assert z.testzip() is None, 'Canonical pack corrupted'
                  z.extractall(temp)
              validators=list(pathlib.Path(temp).rglob('23_VALIDATE_SPEC.py'))
              assert len(validators)==1, 'Missing canonical validator'
              subprocess.run([sys.executable,str(validators[0])],cwd=validators[0].parent,check=True)
          PY
      - name: Reissue exact canonical v1.3.3 and verify narrow v1.3.4 preservation
        run: python3 tests/canonical_pack_reissue_tests.py

  mysql-pilot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: oj_test
          MYSQL_ROOT_PASSWORD: ci_disposable_mysql_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_disposable_mysql_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install matching PHP PDO MySQL extension if missing
        shell: bash
        run: |
          php -v
          if ! php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'; then
            sudo apt-get update
            VERSION="$(php -r 'echo PHP_MAJOR_VERSION,".",PHP_MINOR_VERSION;')"
            sudo apt-get install -y "php${VERSION}-mysql" || sudo apt-get install -y php-mysql
          fi
          php -r 'if (!extension_loaded("pdo_mysql")) exit(1);'
      - name: MySQL 8 database migrations, tenant isolation and owner-reviewed publication
        env:
          OJ_MYSQL_INTEGRATION: '1'
          PARTNER_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=oj_test;charset=utf8mb4'
          PARTNER_DB_USER: root
          PARTNER_DB_PASSWORD: ci_disposable_mysql_only
          PARTNER_TOKEN_HMAC_SECRET: ci-only-partner-api-token-hmac-key-no-live-secrets-123
          RECRUITER_AUTH_HMAC_SECRET: ci-only-recruiter-auth-hmac-key-no-live-secrets-123
        run: php tests/mysql_integration_tests.php

  real-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_READY: '0'
      ANALYTICS_ENABLED: '0'
      ADS_ENABLED: '0'
      OWNER_PANEL_ENABLED: '0'
      RECRUITER_LITE_ENABLED: '0'
      PARTNER_POSTING_API_ENABLED: '0'
      OJ_E2E_BASE: 'http://127.0.0.1:8809'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free headless browser testing runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Start isolated PHP preview and execute actual Chromium journeys
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8809 -t public public/router.php > /tmp/oj-browser-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --silent --fail -o /dev/null "$OJ_E2E_BASE/"; then break; fi
            sleep 1
          done
          curl --silent --fail -o /dev/null "$OJ_E2E_BASE/"
          python3 tests/browser_e2e.py
      - name: Upload local-only browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-e2e-failure
          path: |
            /tmp/oj-browser-preview.log
            artifacts/browser-e2e/
          if-no-files-found: ignore
          retention-days: 3

  hostinger-preview-artifacts:
    needs: [deterministic-tests, mysql-pilot-integration, real-browser-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and safely create separate upload archives
        run: |
          python3 tests/hostinger_bundle_tests.py
          python3 scripts/build_hostinger_bundle.py --output artifacts/hostinger-preview
      - name: Attach downloadable archives for manual review only
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-preview-verified-bundle
          path: artifacts/hostinger-preview/
          if-no-files-found: error
          retention-days: 14

  canonical-v134-artifact:
    needs: [deterministic-tests, mysql-pilot-integration, real-browser-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact canonical source and generate reissued v1.3.4 ZIP
        run: |
          python3 tests/canonical_pack_reissue_tests.py
          python3 scripts/reissue_canonical_pack_v134.py --output artifacts/canonical-v134
      - name: Downloadable versioned canonical source pack (not deployment)
        uses: actions/upload-artifact@v4
        with:
          name: overseasjob-canonical-v134-validated
          path: artifacts/canonical-v134/
          retention-days: 14
          if-no-files-found: error
